<main>
  <div class="page-header">
    <img class="page-header__icon" src="assets/icons/contact.png" alt="">
    <h1 class="page-header__title">Get in <span>Touch</span></h1>
  </div>

  <section class="section section--contact" style="border-top:none;">
    <p class="section__sub">Have a project, an opportunity, or just want to say hi? My inbox is open.</p>

    <div class="contact-grid" style="margin-top:36px;">
      <form class="contact-form" id="contactForm" action="https://formspree.io/f/mqpzagpj" method="POST">
        <label>
          Name
          <input type="text" name="name" placeholder="Your name" required>
        </label>
        <label>
          Email
          <input type="email" name="email" placeholder="you@example.com" required>
        </label>
        <label>
          Message
          <textarea name="message" rows="5" placeholder="What's on your mind?" required></textarea>
        </label>
        <button type="submit" class="btn btn--primary">Send message</button>
        <p class="contact-form__note" id="formNote" role="status"></p>
      </form>

      <div class="contact-side">
        <p class="contact-side__label">Reach me directly</p>
        <a class="contact-side__item" href="mailto:ajukrishnaaju06@gmail.com">ajukrishnaaju06@gmail.com</a>
        <div class="contact-side__socials">
          <a href="https://github.com/Karnan20" aria-label="GitHub"><img src="assets/icons/github.png" alt="GitHub"></a>
          <a href="https://www.instagram.com/aaram.thampuran__/" aria-label="Instagram"><img src="assets/icons/instagram.png" alt="Instagram"></a>
          <a href="mailto:ajukrishnaaju06@gmail.com" aria-label="Email"><img src="assets/icons/email.png" alt="Email"></a>
          <a href="tel:+917736188367" aria-label="Call"><img src="assets/icons/contact.png" alt="Call"></a>
        </div>
